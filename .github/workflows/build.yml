name: Full Automated Hardware Crypto Build Room (Auto-Download)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'main'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis expat
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Hard-Patch Package Build Recipes (Bypass CFLAGS Stripping)
        run: |
          cd openwrt
          
          # 1. Force OpenSSL to treat user-space engine support as built-in active default choice
          sed -i 's/default n/default y/g' package/libs/openssl/Config.in
          
          # 2. 🔥 THE ULTIMATE HARD LOCK: Overwrite OpenWrt's core build optimization targets natively.
          # Instead of appending flags, we hunt down the internal assignment variables inside rules.mk
          # and forcibly replace them so the build engine cannot fallback or strip them down.
          sed -i 's/TARGET_CFLAGS:=.*/TARGET_CFLAGS:=-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53/g' rules.mk
          sed -i 's/TARGET_CXXFLAGS:=.*/TARGET_CXXFLAGS:=-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53/g' rules.mk
          
          # 3. Patch OpenSSL's specific package Makefile directly to append the hardware flags into its compiler stream
          if [ -f package/libs/openssl/Makefile ]; then
            sed -i '/TARGET_CFLAGS/s/$/ -march=armv8-a+crc+crypto -mtune=cortex-a53/' package/libs/openssl/Makefile
          fi
          
          # 4. Patch Unbound's specific feed Makefile directly to inject the acceleration variables into its configuration options
          if [ -f feeds/packages/net/unbound/Makefile ]; then
            sed -i '/TARGET_CFLAGS/s/$/ -march=armv8-a+crc+crypto -mtune=cortex-a53/' feeds/packages/net/unbound/Makefile
          fi

      - name: Fully Automated Target Pre-Configuration
        run: |
          cd openwrt
          
          # Seed target hardware device profile info for D-Link Aquila Pro AI M30 A1
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          echo 'CONFIG_TARGET_OPTIMIZATION="-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53"' >> .config
          
          # Hard-code modular compilation status tags for your application stack
          echo "CONFIG_PACKAGE_kmod-cryptodev=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl-devcrypto=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl-engine=m" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=m" >> .config
          echo "CONFIG_PACKAGE_unbound-control=m" >> .config
          echo "CONFIG_PACKAGE_libevent2=m" >> .config
          echo "CONFIG_PACKAGE_libsodium=m" >> .config
          echo "CONFIG_PACKAGE_libhiredis=m" >> .config
          echo "CONFIG_PACKAGE_libexpat=m" >> .config
          
          # Standardize config matrix entries cleanly
          make defconfig

      - name: Compile Cross-Compiler Toolchain Environment
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Compile Hardware Accelerated Package Stack
        run: |
          cd openwrt
          
          # Compile the baseline kernel tree first to completely eliminate Error 2 module crashes
          make target/linux/compile -j$(nproc)
          make package/index
          
          # Compile optimization core libraries and target apps sequentially
          make package/cryptodev-linux/compile -j$(nproc)
          make package/libs/openssl/compile -j$(nproc)
          make package/libs/libevent2/compile -j$(nproc)
          make package/feeds/packages/libsodium/compile -j$(nproc)
          make package/feeds/packages/hiredis/compile -j$(nproc)
          make package/feeds/packages/expat/compile -j$(nproc)
          make package/feeds/packages/unbound/compile -j$(nproc)

      - name: Securely Upload Compiled APK Artifacts to GitHub Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-unbound-hardware-crypto-packages
          path: openwrt/bin/**/*.apk
