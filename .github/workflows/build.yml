name: Build Complete Full ARMv8 Optimized System Matrix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      # 🟩 THE VISUAL CHECKBOX OVERRIDE: Hardcoding your exact menu choices straight into the source definitions
      - name: Patch Package Config Files Natively
        run: |
          cd openwrt
          
          # 1. Force the master OpenSSL menu configurations to change 'default n' to 'default y' for engines
          sed -i 's/default n/default y/g' package/libs/openssl/Config.in
          
          # 2. Force the global compiler rules file to accept ARMv8 optimizations over standard size savings
          sed -i 's/-Os/-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53/g' rules.mk
          
          # 3. Modify Unbound package definitions to fetch, hash, and compile version 1.26.0 cleanly
          UNBOUND_MAKEFILE="feeds/packages/net/unbound/Makefile"
          if [ -f "$UNBOUND_MAKEFILE" ]; then
            sed -i 's|PKG_VERSION:=.*|PKG_VERSION:=1.26.0|g' "$UNBOUND_MAKEFILE"
            sed -i 's|PKG_HASH:=.*|PKG_HASH:=77458a7156e275c0b7b17fabcb357cb12445d95cfcb26fb9bb7d5ecba45e0b63|g' "$UNBOUND_MAKEFILE"
            sed -i 's|PKG_RELEASE:=.*|PKG_RELEASE:=600|g' "$UNBOUND_MAKEFILE"
            
            # Secure clean configuration injections inside internal compilation arrays
            sed -i 's|--enable-tfo-server|--enable-tfo-server --enable-cachedb --with-libhiredis=$(STAGING_DIR)/usr|g' "$UNBOUND_MAKEFILE"
            sed -i 's|subnetcache ipset respip validator iterator|subnetcache ipset respip validator cachedb iterator|g' "$UNBOUND_MAKEFILE"
            sed -i 's|\$(call Package/unbound/Default)|\$(call Package/unbound/Default)\n  DEPENDS+= +libhiredis|g' "$UNBOUND_MAKEFILE"
          fi

      - name: Configure M30 Target Architecture
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # Force lock package selections globally to built-in state
          echo "CONFIG_PACKAGE_kmod-cryptodev=y" >> .config
          echo "CONFIG_OPENSSL_ENGINE=y" >> .config
          echo "CONFIG_OPENSSL_ENGINE_BUILTIN=y" >> .config
          echo "CONFIG_OPENSSL_ENGINE_BUILTIN_DEVCRYPTO=y" >> .config
          echo "CONFIG_PACKAGE_libopenssl=y" >> .config
          echo "CONFIG_PACKAGE_libopenssl-conf=y" >> .config
          echo "CONFIG_PACKAGE_openssl-util=y" >> .config
          
          # The support libraries you selected visually in menuconfig
          echo "CONFIG_PACKAGE_libsodium=y" >> .config
          echo "CONFIG_PACKAGE_libhiredis=y" >> .config
          echo "CONFIG_PACKAGE_libevent2=y" >> .config
          echo "CONFIG_PACKAGE_libexpat=y" >> .config
          
          # The full Unbound stack selections
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          make defconfig

      - name: Compile Cross Toolchain Baseline
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      # 🟩 THE STEP-BY-STEP COMPILER QUEUE: Built exactly like the manual steps we mapped out
      - name: Run Focused Packages Generation
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          echo "Building package dependency index maps..."
          make package/index
          
          echo "Compiling hardware crypto bridge package natively..."
          make package/cryptodev-linux/compile V=s -j$(nproc)
          
          echo "Compiling hardware-accelerated OpenSSL binaries cleanly..."
          make package/libs/openssl/compile V=s -j$(nproc)
          
          echo "Compiling support libraries stack..."
          make package/libs/libevent2/compile V=s -j$(nproc)
          make package/feeds/packages/libsodium/compile V=s -j$(nproc)
          make package/feeds/packages/hiredis/compile V=s -j$(nproc)
          make package/feeds/packages/expat/compile V=s -j$(nproc)
          
          echo "Compiling full custom Unbound matrix..."
          make package/feeds/packages/unbound/compile V=s -j$(nproc)

      - name: Gather Output Artifacts
        run: |
          TARGET_BIN_DIR="openwrt/bin/packages/aarch64_cortex-a53/base"
          mkdir -p "$TARGET_BIN_DIR"
          find openwrt/bin/packages/aarch64_cortex-a53/ -name "*.apk" -exec cp -v -f {} "$TARGET_BIN_DIR"/ \; 2>/dev/null || true
          find openwrt/bin/targets/mediatek/filogic/ -name "*.apk" -exec cp -v -f {} "$TARGET_BIN_DIR"/ \; 2>/dev/null || true

      - name: Upload Artifact Packages
        uses: actions/upload-artifact@v4
        with:
          name: dlink-m30-hardware-accelerated-packages
          path: openwrt/bin/packages/aarch64_cortex-a53/base/
