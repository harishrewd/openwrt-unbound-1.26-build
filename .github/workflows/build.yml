# Version 1.26.0-Production-UniversalMatrixRescue-PlanC (Boss-Level Hardcoded GCC Hijack)
name: Build Complete Full ARMv8 Optimized Unbound Matrix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Hard-Coded Tweak of Unbound Suite Version and Engine Manifest
        run: |
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Configuring version parameters inside Unbound package manifest..."
            sed -i 's|PKG_VERSION:=.*|PKG_VERSION:=1.26.0|g' "$MAKEFILE_PATH"
            sed -i 's|PKG_HASH:=.*|PKG_HASH:=77458a7156e275c0b7b17fabcb357cb12445d95cfcb26fb9bb7d5ecba45e0b63|g' "$MAKEFILE_PATH"
            sed -i 's|PKG_RELEASE:=.*|PKG_RELEASE:=600|g' "$MAKEFILE_PATH"
            
            # Map parameters cleanly inside core configuration arguments array
            sed -i 's|--enable-tfo-server|--enable-tfo-server --enable-cachedb --with-libhiredis=$(STAGING_DIR)/usr|g' "$MAKEFILE_PATH"
            sed -i 's|subnetcache ipset respip validator iterator|subnetcache ipset respip validator cachedb iterator|g' "$MAKEFILE_PATH"
            sed -i 's|\$(call Package/unbound/Default)|\$(call Package/unbound/Default)\n  DEPENDS+= +libhiredis|g' "$MAKEFILE_PATH"
            sed -i 's|--enable-allsymbols||g' "$MAKEFILE_PATH"
          else
            echo "❌ Error: Unbound Makefile not found!" && exit 1
          fi

      - name: Configure M30 Target Architecture & Build System Matrix
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          make defconfig

      - name: Compile Cross-Build Toolchain Baseline
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Hijack Toolchain Binaries and Force Hardcoded ARMv8 Flags
        run: |
          cd openwrt
          echo "🔥 Executing absolute GCC compiler wrapper binary hijack loop..."
          
          # Find the exact cross-compiler directory created by the toolchain step
          TOOLCHAIN_BIN_DIR=$(find staging_dir/ -type d -name "bin" | grep "toolchain-" | head -n 1)
          
          if [ -d "$TOOLCHAIN_BIN_DIR" ]; then
            cd "$TOOLCHAIN_BIN_DIR"
            
            # Intercept the target C compiler
            if [ -f "aarch64-openwrt-linux-musl-gcc" ]; then
              mv aarch64-openwrt-linux-musl-gcc aarch64-openwrt-linux-musl-gcc.real
              echo '#!/usr/bin/env bash' > aarch64-openwrt-linux-musl-gcc
              echo 'exec "$(dirname "$0")/aarch64-openwrt-linux-musl-gcc.real" -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53 "$@"' >> aarch64-openwrt-linux-musl-gcc
              chmod +x aarch64-openwrt-linux-musl-gcc
            fi
            
            # Intercept the target C++ compiler
            if [ -f "aarch64-openwrt-linux-musl-g++" ]; then
              mv aarch64-openwrt-linux-musl-g++ aarch64-openwrt-linux-musl-g++.real
              echo '#!/usr/bin/env bash' > aarch64-openwrt-linux-musl-g++
              echo 'exec "$(dirname "$0")/aarch64-openwrt-linux-musl-g++.real" -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53 "$@"' >> aarch64-openwrt-linux-musl-g++
              chmod +x aarch64-openwrt-linux-musl-g++
            fi
            echo "✅ GCC binary tracking hooks successfully hijacked with hardcoded flags!"
          else
            echo "❌ Error: Toolchain bin folder not found!" && exit 1
          fi

      - name: Compile Optimized 11-File Hardware Matrix Packages
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          # 1. COMPILE OPENSSL WITH HARDWARE PLATFORM SPECIFICATION
          echo "🏗 Compiling hardware-accelerated OpenSSL core..."
          OPENSSL_MAKEFILE="package/libs/openssl/Makefile"
          if [ -f "$OPENSSL_MAKEFILE" ]; then
            sed -i 's|OPENSSL_TARGET:=.*|OPENSSL_TARGET:=linux-aarch64|g' "$OPENSSL_MAKEFILE"
          fi
          make package/libs/openssl/compile V=s -j$(nproc)
          
          # 2. COMPILE LIBEVENT
          echo "🏗 Compiling hardware-accelerated libevent..."
          make package/libs/libevent/compile V=s -j$(nproc)

          # 3. COMPILE LIBEXPAT
          echo "🏗 Compiling hardware-accelerated libexpat..."
          make package/feeds/packages/expat/compile V=s -j$(nproc)

          # 4. COMPILE LIBSODIUM & HIREDIS (Clean and un-overrideable!)
          echo "🏗 Compiling optimized libsodium..."
          make package/feeds/packages/libsodium/compile V=s -j$(nproc)
          
          echo "🏗 Compiling optimized hiredis..."
          make package/feeds/packages/hiredis/compile V=s -j$(nproc)
          
          # 5. COMPILE ALL COMPLETE UNBOUND PACKAGES AT ONCE
          echo "🏗 Compiling full custom Unbound matrix suite..."
          make package/feeds/packages/unbound/compile V=s -j$(nproc) IPKG_INSTANT_CHECK=0

      - name: Rescue All Hardware-Accelerated Matrix Packages via Wildcard
        run: |
          echo "🚀 Running universal wildcard finder sweep across compilation workspace tracks..."
          TARGET_BIN_DIR="openwrt/bin/packages/aarch64_cortex-a53/base"
          mkdir -p "$TARGET_BIN_DIR"
          
          find openwrt/build_dir/target-aarch64_cortex-a53_musl/ -type d -name "ipkg-*" | while read -r IPKG_ROOT; do
             if [ -d "$IPKG_ROOT/libopenssl" ] || [ -d "$IPKG_ROOT/openssl-util" ] || [ -d "$IPKG_ROOT/libevent" ] || [ -d "$IPKG_ROOT/libexpat" ] || [ -d "$IPKG_ROOT/unbound-daemon" ] || [ -d "$IPKG_ROOT/unbound-control" ] || [ -d "$IPKG_ROOT/unbound-checkconf" ] || [ -d "$IPKG_ROOT/unbound-anchor" ] || [ -d "$IPKG_ROOT/unbound-host" ] || [ -d "$IPKG_ROOT/libhiredis" ] || [ -d "$IPKG_ROOT/libsodium" ]; then
                echo "Securing critical hardware package matching layer: $IPKG_ROOT"
                find "$IPKG_ROOT" \( -name "*.apk" -o -name "*.ipk" \) -exec cp -v -f {} "$TARGET_BIN_DIR"/ \;
             fi
          done
          
          # Gather alternative locations from bin outputs cleanly
          find openwrt/bin/packages/aarch64_cortex-a53/ -name "*.apk" -exec cp -v -f {} "$TARGET_BIN_DIR"/ \; 2>/dev/null || true
          echo "✔ Complete structural matrix rescue completed successfully!"

      - name: Upload All Finished Packages
        uses: actions/upload-artifact@v4
        with:
          name: dlink-m30-universal-hardware-matrix-packages
          path: openwrt/bin/**/*.apk
