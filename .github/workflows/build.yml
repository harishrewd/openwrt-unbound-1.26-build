# Version 1.26.0-Production-TrueARMv8Offload-RedisEnabled-r700 (Certified Hardened O2 Build)
name: Build True ARMv8 Optimized Unbound 1.26.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          # NATIVE STAGING: Pre-loads hiredis straight into your working feeds layout alongside libsodium
          ./scripts/feeds install libsodium hiredis
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Hard-Coded Injection of True ARMv8 Hardware Assembly Flags
        run: |
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Tweaking specific package configuration parameter block..."
            
            # 1. VERSION LOCKING: Explicitly upgrade the source files to target official stable 1.26.0
            sed -i 's|PKG_VERSION:=.*|PKG_VERSION:=1.26.0|g' "$MAKEFILE_PATH"
            
            # 2. FORCE HASH ALIGNMENT: Matches the downloaded official stable 1.26.0 fingerprint
            sed -i 's|PKG_HASH:=.*|PKG_HASH:=77458a7156e275c0b7b17fabcb357cb12445d95cfcb26fb9bb7d5ecba45e0b63|g' "$MAKEFILE_PATH"
            
            # 3. THE HARDWARE FIX: Forcefully pass the target options strictly into Unbound's native configure engine
            # This completely isolates the optimizations away from OpenSSL and Libsodium, avoiding toolchain crashes
            sed -i 's|--enable-tfo-server|--enable-tfo-server \\\n\t--with-extra-cflags="-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53" \\\n\t--enable-cachedb \\\n\t--with-libhiredis=\$(STAGING_DIR)/usr|g' "$MAKEFILE_PATH"
            
            # 4. FIXED MODULE SEQUENCE: Aligns cachedb cleanly between validator and iterator so it parses without errors
            sed -i 's|subnetcache ipset respip validator iterator|subnetcache ipset respip validator cachedb iterator|g' "$MAKEFILE_PATH"
            
            # 5. CACHE CONTROL RELEASE BUMP: Replaces release tracking iteration to 700 to break stale router file memory caches
            sed -i 's|PKG_RELEASE:=.*|PKG_RELEASE:=700|g' "$MAKEFILE_PATH"
            
            # 6. FIXED DEPENDENCY INJECTION: Safely appends the runtime dependency using OpenWrt's default block hook to pass APK validation
            sed -i 's|\$(call Package/unbound/Default)|\$(call Package/unbound/Default)\n  DEPENDS+= +libhiredis|g' "$MAKEFILE_PATH"
            
            # 7. Cleanly strip allsymbols so it stops breaking your multi-threaded speeds
            sed -i 's|--enable-allsymbols||g' "$MAKEFILE_PATH"
            
            grep -E "PKG_VERSION|PKG_RELEASE|PKG_HASH|CONFIGURE_ARGS|cachedb|DEPENDS" "$MAKEFILE_PATH"
          else
            echo "❌ Error: Makefile not found at $MAKEFILE_PATH!" && exit 1
          fi

      - name: Configure M30 Target Architecture & Build System Matrix
        run: |
          cd openwrt
          
          # Target Profile Specification for D-Link M30
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # Enable dependencies and core packages to compile cleanly
          echo "CONFIG_PACKAGE_libsodium=y" >> .config
          echo "CONFIG_PACKAGE_libhiredis=y" >> .config
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-control=y" >> .config
          echo "CONFIG_PACKAGE_unbound-checkconf=y" >> .config
          echo "CONFIG_PACKAGE_unbound-anchor=y" >> .config
          echo "CONFIG_PACKAGE_unbound-host=y" >> .config
          
          # Native sub-package target switches
          echo "CONFIG_PACKAGE_libunbound_dnscrypt=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_ipset=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libevent=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libpthread=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_subnet=y" >> .config
          
          make defconfig

      - name: Compile Toolchain and Dependencies
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          # 1. Compile baseline tools and cross-compiler toolchain normally
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          # 2. Compile standard dependencies without overriding their internal hardware architectures
          echo "📦 Pre-compiling Libsodium toolchain requirements..."
          make package/feeds/packages/libsodium/compile V=s -j$(nproc)
          
          echo "📦 Pre-compiling Hiredis toolchain requirements..."
          make package/feeds/packages/hiredis/compile V=s -j$(nproc)
          
          # 3. Clean and prepare Unbound workspace
          echo "🧹 Performing clean build sweep on Unbound..."
          make package/feeds/packages/unbound/clean
          make package/feeds/packages/unbound/download
          
          # 4. EXECUTE COUPLING LAYER: Build custom optimized package stack
          echo "🏗 Compiling custom Unbound suite with isolated hardware configure parameters..."
          make package/feeds/packages/unbound/compile V=s -j$(nproc) IPKG_INSTANT_CHECK=0

      - name: Upload All Finished APK Files
        uses: actions/upload-artifact@v4
        with:
          name: dlink-m30-unbound-dnscrypt-complete-apk
          path: openwrt/bin/**/*.apk
