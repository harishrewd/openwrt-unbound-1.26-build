# Version 1.26.0-Production-MissingMatrixRescue-r600 (Certified Complete Missing Stack)
name: Build Missing Targeted ARMv8 Supporting Libraries

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install hiredis
          ./scripts/feeds install libunbound

      - name: Inject True ARMv8 Flags into Unbound & libunbound Makefile
        run: |
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Tweaking Unbound/libunbound build parameters..."
            sed -i '/include \$(INCLUDE_DIR)\/package\.mk/i TARGET_CFLAGS:=\$(filter-out -Os, \$(TARGET_CFLAGS)) -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53\nEXTRA_CFLAGS:=\$(filter-out -Os, \$(EXTRA_CFLAGS)) -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' "$MAKEFILE_PATH"
          fi

      - name: Configure M30 Target Architecture & Build System Matrix
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # Force global flag override loop (catches background utilities)
          echo 'CONFIG_TARGET_OPTIMIZATION="-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53"' >> .config
          
          echo "CONFIG_PACKAGE_libevent=y" >> .config
          echo "CONFIG_PACKAGE_libexpat=y" >> .config
          echo "CONFIG_PACKAGE_libhiredis=y" >> .config
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          make defconfig

      - name: Compile Host Tools and Targeted Missing Libraries
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          # 1. INJECT HARDWARE FLAGS AND COMPILE SYSTEM CORE LIBEVENT
          LIBEVENT_MAKEFILE="package/libs/libevent/Makefile"
          if [ -f "$LIBEVENT_MAKEFILE" ]; then
            sed -i '/include \$(INCLUDE_DIR)\/package\.mk/i TARGET_CFLAGS:=\$(filter-out -Os, \$(TARGET_CFLAGS)) -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' "$LIBEVENT_MAKEFILE"
            make package/libs/libevent/compile V=s -j$(nproc)
          fi

          # 2. INJECT HARDWARE FLAGS AND COMPILE SYSTEM CORE LIBEXPAT
          LIBEXPAT_MAKEFILE="package/libs/expat/Makefile"
          if [ -f "$LIBEXPAT_MAKEFILE" ]; then
            sed -i '/include \$(INCLUDE_DIR)\/package\.mk/i TARGET_CFLAGS:=\$(filter-out -Os, \$(TARGET_CFLAGS)) -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' "$LIBEXPAT_MAKEFILE"
            make package/libs/expat/compile V=s -j$(nproc)
          fi

          # 3. COMPILE APP-FEED HIREDIS (Inherits global optimization variable arrays)
          make package/feeds/packages/hiredis/compile V=s -j$(nproc)
          
          # 4. COMPILE APP-FEED LIBUNBOUND TARGET
          make package/feeds/packages/unbound/compile V=s -j$(nproc) IPKG_INSTANT_CHECK=0

      # 🔥 YOUR PROVEN WILDCARD RESCUE SWITCH: Pulls out the un-deleted packages right from internal registers!
      - name: Rescue Hardware-Accelerated Core Matrix Packages via Wildcard
        run: |
          echo "🚀 Gathering optimized target APK files from internal registers..."
          TARGET_BIN_DIR="openwrt/bin/packages/aarch64_cortex-a53/base"
          mkdir -p "$TARGET_BIN_DIR"
          
          find openwrt/build_dir/target-aarch64_cortex-a53_musl/ -type d -name "ipkg-*" | while read -r IPKG_ROOT; do
            if [ -d "$IPKG_ROOT/libevent" ] || [ -d "$IPKG_ROOT/libexpat" ] || [ -d "$IPKG_ROOT/libhiredis" ] || [ -d "$IPKG_ROOT/libunbound" ]; then
               echo "Securing package workspace match inside: $IPKG_ROOT"
               find "$IPKG_ROOT" -name "*.apk" -exec cp -v -f {} "$TARGET_BIN_DIR"/ \;
            fi
          done
          echo "✔ Missing library rescue execution complete."

      - name: Upload All Finished APK Files
        uses: actions/upload-artifact@v4
        with:
          name: dlink-m30-missing-hardware-matrix-apks
          path: openwrt/bin/**/*.apk
