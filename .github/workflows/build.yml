# Version 1.26.0-Production-TrueSpeedOverridden-FixedMatrix (Certified Complete 11-File Stack)
name: Build Complete Full ARMv8 Optimized Unbound Matrix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis expat
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Hard-Coded Tweak of Unbound Suite Version and Engine Manifest
        run: |
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Configuring version parameters inside Unbound package manifest..."
            sed -i 's|PKG_VERSION:=.*|PKG_VERSION:=1.26.0|g' "$MAKEFILE_PATH"
            sed -i 's|PKG_HASH:=.*|PKG_HASH:=77458a7156e275c0b7b17fabcb357cb12445d95cfcb26fb9bb7d5ecba45e0b63|g' "$MAKEFILE_PATH"
            sed -i 's|PKG_RELEASE:=.*|PKG_RELEASE:=600|g' "$MAKEFILE_PATH"
            
            # Map parameters cleanly inside core configuration arguments array
            sed -i 's|--enable-tfo-server|--enable-tfo-server --enable-cachedb --with-libhiredis=$(STAGING_DIR)/usr|g' "$MAKEFILE_PATH"
            sed -i 's|subnetcache ipset respip validator iterator|subnetcache ipset respip validator cachedb iterator|g' "$MAKEFILE_PATH"
            sed -i 's|\$(call Package/unbound/Default)|\$(call Package/unbound/Default)\n  DEPENDS+= +libhiredis|g' "$MAKEFILE_PATH"
            sed -i 's|--enable-allsymbols||g' "$MAKEFILE_PATH"
          else
            echo "❌ Error: Unbound Makefile not found!" && exit 1
          fi

      - name: Brute Force Hack of Master Target Optimization Rules (Safe Flag Locking)
        run: |
          cd openwrt
          echo "🔥 Injecting ARMv8 speed optimizations directly into system frameworks..."
          
          # Force OpenSSL to treat user-space engine support as built-in default choice
          sed -i 's/default n/default y/g' package/libs/openssl/Config.in
          
          # Hard-overwrite default optimization designations inside master framework files cleanly
          TARGET_MK="include/target.mk"
          if [ -f "$TARGET_MK" ]; then
            sed -i 's|TARGET_CFLAGS_DESIGNATION=-Os|TARGET_CFLAGS_DESIGNATION=-O2|g' "$TARGET_MK"
            sed -i 's|-Os|-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53|g' "$TARGET_MK"
          fi
          
          # Force replacement inside global system rule definitions safely
          sed -i 's/TARGET_CFLAGS:=.*/TARGET_CFLAGS:=-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53/g' rules.mk
          sed -i 's/TARGET_CXXFLAGS:=.*/TARGET_CXXFLAGS:=-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53/g' rules.mk
          
          # 🔥 SAFE INJECTION LAYER: Force append global environment compiler flags.
          # This passes your speed parameters to OpenSSL and Unbound cleanly without touching their Makefiles.
          echo 'TARGET_CFLAGS += -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' >> rules.mk
          echo 'TARGET_CXXFLAGS += -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' >> rules.mk
          echo 'EXTRA_CFLAGS += -O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53' >> rules.mk

      - name: Configure M30 Target Architecture & Build System Matrix
        run: |
          cd openwrt
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # Lock target optimizations into seed matrix configuration parameters
          echo 'CONFIG_TARGET_OPTIMIZATION="-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53"' >> .config
          
          # Force-seed the absolute complete 11-file package selection matrix explicitly
          echo "CONFIG_PACKAGE_kmod-cryptodev=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl-conf=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl-devcrypto=m" >> .config
          echo "CONFIG_PACKAGE_libopenssl-engine=m" >> .config
          echo "CONFIG_PACKAGE_openssl-util=m" >> .config
          echo "CONFIG_PACKAGE_libmnl=m" >> .config
          echo "CONFIG_PACKAGE_libsodium=m" >> .config
          echo "CONFIG_PACKAGE_libhiredis=m" >> .config
          echo "CONFIG_PACKAGE_libexpat=m" >> .config
          echo "CONFIG_PACKAGE_libevent2=m" >> .config
          echo "CONFIG_PACKAGE_libunbound=m" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=m" >> .config
          echo "CONFIG_PACKAGE_unbound-control=m" >> .config
          echo "CONFIG_PACKAGE_unbound-control-setup=m" >> .config
          echo "CONFIG_PACKAGE_unbound-checkconf=m" >> .config
          echo "CONFIG_PACKAGE_unbound-anchor=m" >> .config
          echo "CONFIG_PACKAGE_unbound-host=m" >> .config
          
          # Inject full sub-module configuration layer flags
          echo "CONFIG_PACKAGE_libunbound_dnscrypt=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_ipset=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libevent=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libpthread=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_subnet=y" >> .config
          make defconfig

      - name: Compile Cross-Compiler Toolchain and Universal Hardware Matrix
        run: |
          cd openwrt
          
          # Build underlying compilation host tools and target cross toolchains
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          # Compile the baseline kernel tree first to completely eliminate Error 2 dependency module crashes
          make target/linux/compile -j$(nproc)
          make package/index
          
          # Execute sequential package compilation streams tracking your exact structural requirements
          make package/cryptodev-linux/compile -j$(nproc)
          
          # Force target definitions parameter inside OpenSSL package block cleanly without line patching
          OPENSSL_MAKEFILE="package/libs/openssl/Makefile"
          if [ -f "$OPENSSL_MAKEFILE" ]; then
            sed -i 's|OPENSSL_TARGET:=.*|OPENSSL_TARGET:=linux-aarch64|g' "$OPENSSL_MAKEFILE"
          fi
          make package/libs/openssl/compile -j$(nproc)
          
          # Compile remaining dependencies and the complete Unbound package tree
          make package/libs/libmnl/compile -j$(nproc)
          make package/libs/libevent2/compile -j$(nproc)
          make package/feeds/packages/expat/compile -j$(nproc)
          make package/feeds/packages/libsodium/compile -j$(nproc)
          make package/feeds/packages/hiredis/compile -j$(nproc)
          make package/feeds/packages/unbound/compile -j$(nproc) IPKG_INSTANT_CHECK=0

      - name: Securely Upload Compiled APK Artifacts to GitHub Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dlink-m30-universal-hardware-matrix-packages
          path: openwrt/bin/**/*.apk
