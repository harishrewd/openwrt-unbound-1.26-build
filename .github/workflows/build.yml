# Version 1.26.0-Production-TrueARMv8Offload-RedisEnabled-r300 (Certified Hardened O2 Build)
name: Build True ARMv8 Optimized Unbound 1.26.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis libevent2
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Hard-Coded Injection of True ARMv8 Hardware Assembly Flags
        run: |
          MAKEFILE_PATH="openwrt/feeds/packages/net/unbound/Makefile"
          
          if [ -f "$MAKEFILE_PATH" ]; then
            echo "⚙️ Tweaking specific package configuration parameter block..."
            
            # 1. VERSION LOCKING & HASH ALIGNMENT
            sed -i 's|PKG_VERSION:=.*|PKG_VERSION:=1.26.0|g' "$MAKEFILE_PATH"
            sed -i 's|PKG_HASH:=.*|PKG_HASH:=77458a7156e275c0b7b17fabcb357cb12445d95cfcb26fb9bb7d5ecba45e0b63|g' "$MAKEFILE_PATH"
            
            # 2. FORCE CACHEDB MODULE SEQUENCE ALIGNMENT
            sed -i 's|subnetcache ipset respip validator iterator|subnetcache ipset respip validator cachedb iterator|g' "$MAKEFILE_PATH"
            
            # 3. CACHE CONTROL RELEASE BUMP (Set to 300)
            sed -i 's|PKG_RELEASE:=.*|PKG_RELEASE:=300|g' "$MAKEFILE_PATH"
            
            # 4. CLEAN UP SPEED LIMITING OVERRIDES
            sed -i 's|--enable-allsymbols||g' "$MAKEFILE_PATH"
            
            # 5. FIXED CONFIGURE ARGS APPEND
            # Safely passes your optimized flags straight to Unbound's Autotools engine layer
            sed -i 's|--enable-tfo-server|--enable-tfo-server --enable-cachedb --with-libhiredis=$(STAGING_DIR)/usr --with-cflags="-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53"|g' "$MAKEFILE_PATH"
            
            echo "📊 Verifying Patch Integrity..."
            grep -E "PKG_VERSION|PKG_RELEASE|PKG_HASH|CONFIGURE_ARGS|cachedb" "$MAKEFILE_PATH" || true
          else
            echo "❌ Error: Makefile not found at $MAKEFILE_PATH!" && exit 1
          fi

      - name: Configure M30 Target Architecture & Build System Matrix
        run: |
          cd openwrt
          
          # Target Profile Specification for D-Link M30 (MediaTek Filogic MT7981 / ARMv8)
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # FORUM VALIDATED HARDWARE CRYPTO ENGINE OVERRIDE DEFINITIONS
          # Forces the cross-compiler to build native ARMv8 crypto instructions into libcrypto.so
          echo "CONFIG_OPENSSL_WITH_ASM=y" >> .config
          echo "CONFIG_OPENSSL_WITH_ARMV8_ASM=y" >> .config
          echo "CONFIG_OPENSSL_ENGINE=y" >> .config
          
          # GLOBAL ENVIRONMENT FLAG FORCE OVERRIDE
          # This instructs the compiler to strip standard generic target limits (-Os) globally 
          # and use your high-performance hardware crypto instruction sets across the build tree
          echo "CONFIG_TARGET_OPTIMIZATION=\"-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53\"" >> .config
          
          # Enable dependencies and core packages to compile safely via target matrix rules
          echo "CONFIG_PACKAGE_libsodium=y" >> .config
          echo "CONFIG_PACKAGE_libhiredis=y" >> .config
          echo "CONFIG_PACKAGE_libevent2=y" >> .config
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-control=y" >> .config
          echo "CONFIG_PACKAGE_unbound-checkconf=y" >> .config
          echo "CONFIG_PACKAGE_unbound-anchor=y" >> .config
          echo "CONFIG_PACKAGE_unbound-host=y" >> .config
          
          # Native working feature sub-package target switches
          echo "CONFIG_PACKAGE_libunbound-dnscrypt=y" >> .config
          echo "CONFIG_PACKAGE_libunbound-ipset=y" >> .config
          echo "CONFIG_PACKAGE_libunbound-libevent=y" >> .config
          echo "CONFIG_PACKAGE_libunbound-libpthread=y" >> .config
          echo "CONFIG_PACKAGE_libunbound-subnet=y" >> .config
          
          make defconfig

      - name: Compile Toolchain and Dependencies
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          # 1. Compile baseline tools and cross-compiler toolchain normally
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)
          
          # 2. Compile standard dependencies normally using OpenWrt shortname target targets
          echo "📦 Pre-compiling Libsodium toolchain requirements..."
          make package/libsodium/compile V=s -j$(nproc)
          
          echo "📦 Pre-compiling Hiredis toolchain requirements..."
          make package/hiredis/compile V=s -j$(nproc)

          echo "📦 Pre-compiling Libevent toolchain requirements..."
          make package/libevent2/compile V=s -j$(nproc)

          echo "📦 Pre-compiling Hardware-Accelerated OpenSSL toolchain requirements..."
          make package/openssl/compile V=s -j$(nproc)

      - name: Hardened Unbound High-Performance Native Compilation Step
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          # Force clean workspace sweep to guarantee fresh binary flag embedding
          make package/unbound/clean
          make package/unbound/download
          
          echo "🏗 Compiling custom Unbound suite with protected hardware crypto flags..."
          make package/unbound/compile V=s -j$(nproc) IPKG_INSTANT_CHECK=0

      - name: Verify Binary Architecture Flags
        run: |
          cd openwrt
          # Scan the build workspace to locate the compiled Unbound binary executable
          UNBOUND_BIN=$(find build_dir/target-aarch64_cortex-a53* -name unbound -type f | head -n 1)
          if [ -f "$UNBOUND_BIN" ]; then
            echo "🔍 Inspecting binary properties to confirm compilation success..."
            file "$UNBOUND_BIN"
          else
            echo "⚠️ Warning: Compiled binary not found in build_dir for architectural logging."
          fi

      - name: Upload All Finished APK Files
        uses: actions/upload-artifact=v4
        with:
          name: dlink-m30-unbound-dnscrypt-complete-apk
          path: openwrt/bin/**/*.apk
