# Version 1.26.0-Production-TrueARMv8Offload-RedisEnabled-r600 (Certified Hardened O2 Build)
name: Build True ARMv8 Optimized Unbound 1.26.0 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      - name: Inject Target Package Specific Configuration Patches
        run: |
          UNBOUND_MAKEFILE="openwrt/feeds/packages/net/unbound/Makefile"
          
          if [ -f "$UNBOUND_MAKEFILE" ]; then
            echo "⚙️ Injecting module structure parameters cleanly..."
            # 1. Force the Unbound target version parameters to clean 1.26.0
            sed -i 's|PKG_VERSION:=.*|PKG_VERSION:=1.26.0|g' "$UNBOUND_MAKEFILE"
            sed -i 's|PKG_HASH:=.*|PKG_HASH:=77458a7156e275c0b7b17fabcb357cb12445d95cfcb26fb9bb7d5ecba45e0b63|g' "$UNBOUND_MAKEFILE"
            sed -i 's|PKG_RELEASE:=.*|PKG_RELEASE:=600|g' "$UNBOUND_MAKEFILE"
            
            # 2. Inject cachedb and Redis support cleanly without the invalid --with-cflags parameter
            sed -i 's|--enable-tfo-server|--enable-tfo-server \\\n\t--enable-cachedb \\\n\t--with-libhiredis=$(STAGING_DIR)/usr|g' "$UNBOUND_MAKEFILE"
            
            # 3. Clean module sequence ordering
            sed -i 's|subnetcache ipset respip validator iterator|subnetcache ipset respip validator cachedb iterator|g' "$UNBOUND_MAKEFILE"
            
            # 4. Safe APK dependency injection 
            sed -i 's|\$(call Package/unbound/Default)|\$(call Package/unbound/Default)\n  DEPENDS+= +libhiredis|g' "$UNBOUND_MAKEFILE"
            sed -i 's|--enable-allsymbols||g' "$UNBOUND_MAKEFILE"
          else
            echo "❌ Error: Unbound Makefile not found!" && exit 1
          fi

          # 5. Point OpenSSL cleanly to the 64-bit ARM assembly backend engines
          OPENSSL_MAKEFILE="openwrt/package/libs/openssl/Makefile"
          if [ -f "$OPENSSL_MAKEFILE" ]; then
            sed -i 's|OPENSSL_TARGET:=.*|OPENSSL_TARGET:=linux-aarch64|g' "$OPENSSL_MAKEFILE"
          fi

      - name: Configure M30 Target Architecture & Build System Matrix
        run: |
          cd openwrt
          
          # Force M30 target variables
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_dlink_aquila-pro-ai-m30-a1=y" >> .config
          
          # NATIVE OVERRIDE: Tells the OpenWrt global engine to use these exact hardware flags for ALL packages instead of -Os
          echo 'CONFIG_TARGET_OPTIMIZATION="-O2 -pipe -march=armv8-a+crc+crypto -mtune=cortex-a53"' >> .config
          
          # Core Package definitions
          echo "CONFIG_PACKAGE_libopenssl=y" >> .config
          echo "CONFIG_PACKAGE_libopenssl-conf=y" >> .config
          echo "CONFIG_PACKAGE_libsodium=y" >> .config
          echo "CONFIG_PACKAGE_libhiredis=y" >> .config
          echo "CONFIG_PACKAGE_libunbound=y" >> .config
          echo "CONFIG_PACKAGE_unbound-daemon=y" >> .config
          echo "CONFIG_PACKAGE_unbound-control=y" >> .config
          echo "CONFIG_PACKAGE_unbound-checkconf=y" >> .config
          echo "CONFIG_PACKAGE_unbound-anchor=y" >> .config
          echo "CONFIG_PACKAGE_unbound-host=y" >> .config
          
          # Extensions mapping
          echo "CONFIG_PACKAGE_libunbound_dnscrypt=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_ipset=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libevent=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_libpthread=y" >> .config
          echo "CONFIG_PACKAGE_libunbound_subnet=y" >> .config
          
          make defconfig

      - name: Compile Toolchain and Dependencies
        run: |
          cd openwrt
          export FORCE_UNSAFE_CONFIGURE=1
          
          # Compile baseline cross-compilers normally
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

          echo "🏗 Compiling hardware-accelerated OpenSSL core..."
          make package/libs/openssl/compile V=s -j$(nproc)
          
          echo "📦 Pre-compiling Libsodium toolchain requirements..."
          make package/feeds/packages/libsodium/compile V=s -j$(nproc)
          
          echo "📦 Pre-compiling Hiredis toolchain requirements..."
          make package/feeds/packages/hiredis/compile V=s -j$(nproc)
          
          echo "🧹 Cleaning Unbound directory hooks..."
          make package/feeds/packages/unbound/clean
          make package/feeds/packages/unbound/download
          
          echo "🏗 Compiling custom Unbound suite with target optimization arrays..."
          make package/feeds/packages/unbound/compile V=s -j$(nproc) IPKG_INSTANT_CHECK=0

      - name: Upload All Finished APK Files
        uses: actions/upload-artifact@v4
        with:
          name: dlink-m30-unbound-dnscrypt-complete-apk
          path: openwrt/bin/**/*.apk
